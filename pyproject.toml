[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-excel-ingest-framework"
version = "0.1.0a15"
description = "Databricks-native Excel ingestion framework: validate, detect structure, extract metadata, and map columns to canonical fields"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Nitin Mathew George" }]
keywords = [
    "databricks", "excel", "ingestion", "etl", "unity-catalog",
    "delta-lake", "data-engineering", "canonical-mapping", "openpyxl"
]

dependencies = [
    "openpyxl>=3.0.0",
    "msoffcrypto-tool>=5.0.0",
]

[project.optional-dependencies]
databricks = [
    "databricks-sdk>=0.18.0",
]
openai = [
    "openai>=1.0.0",
]
anthropic = [
    "anthropic>=0.20.0",
]
all = [
    "databricks-sdk>=0.18.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
]
dev = ["pytest>=7", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["excel_ingest*"]

[tool.setuptools.package-data]
"excel_ingest" = ["sample_usage/*", "sample_usage/samples/*"]
