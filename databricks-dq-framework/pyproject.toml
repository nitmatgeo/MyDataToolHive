[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-dq-framework"
version = "1.1.0"
description = "Metadata-driven Data Quality Assessment Framework for Databricks / Delta Lake"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Nitin Mathew George" }
]
keywords = ["databricks", "delta-lake", "data-quality", "pyspark", "dq-framework"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "python-dateutil>=2.8",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/nitmatgeo/MyDataToolHive"
Repository = "https://github.com/nitmatgeo/MyDataToolHive"
"Source Code" = "https://github.com/nitmatgeo/MyDataToolHive/tree/main/databricks-dq-framework"
"Bug Tracker" = "https://github.com/nitmatgeo/MyDataToolHive/issues"

[project.optional-dependencies]
standalone = [
    "pyspark>=3.3",
    "delta-spark>=2.0",
]
dev = ["pytest>=7", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dq_framework*"]

[tool.setuptools.package-data]
"dq_framework" = ["sample_usage/*"]
