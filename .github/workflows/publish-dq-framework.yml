name: Publish databricks-dq-framework

on:
  push:
    branches: [main]
    paths:
      - "databricks-dq-framework/**"
  workflow_dispatch:   # allow manual trigger from Actions tab

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        working-directory: databricks-dq-framework
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dq-framework-dist
          path: databricks-dq-framework/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # Required for OIDC trusted publishing — no API token needed
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/databricks-dq-framework/

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dq-framework-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # no-op if this version already published
