[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-etl-monitor"
version = "0.1.0"
description = "Metadata-driven ETL Process Monitoring Framework for Databricks / Delta Lake"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Nitin Mathew George" }
]
keywords = [
    "databricks", "delta-lake", "etl", "etl-monitoring", "etl-framework",
    "pyspark", "adf", "azure-data-factory", "unity-catalog",
    "data-engineering", "data-engineer", "data-pipeline", "pipeline-monitoring",
    "notebook-monitoring", "databricks-notebooks", "adf-monitoring",
    "watermark", "orchestration", "delta-lake-monitoring", "etl-orchestration"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Database",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/NitMatGeo"

[project.optional-dependencies]
standalone = [
    "pyspark>=3.3",
    "delta-spark>=2.0",
]
dev = ["pytest>=7", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["etl_monitor*"]

[tool.setuptools.package-data]
"etl_monitor" = ["sample_usage/*"]
